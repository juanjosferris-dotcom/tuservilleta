<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Demo Tu Servilleta</title>
  <link rel="stylesheet" href="/tuservilleta-personalizador/assets/css/customizer.css" />
  <style>body{background:#e2e8f0;padding:24px;}</style>
  <script>
    window.TuservilletaData = {
      catalog: [
        {size:'Servilletas 20x20 (10x10 plegada)', type:'2 Capas', color:'Blanco', quantity:'100', printing:'1 tinta', price:120},
        {size:'Servilletas 24x24 (12x12 plegada)', type:'3 Capas', color:'Negro', quantity:'200', printing:'1 tinta', price:200},
        {size:'Servilletas 30x30 (15x15 plegada)', type:'Doble Punto', color:'Beige', quantity:'300', printing:'Doble cara', price:260},
        {size:'Servilletas 33x33 (16,5x16,5 plegada)', type:'Tisú Seco', color:'Burdeos', quantity:'400', printing:'1 tinta', price:320}
      ],
      settings: {currency:'EUR', accent_color:'#0f172a', paypal_business:'demo@business.com', stripe_link:'', hubspot_portal_id:'', hubspot_form_id:'', step_images:{}},
      ajaxUrl: 'about:blank',
      nonce: 'demo',
      strings: {
        emptyCatalog: 'Sube un catálogo para comenzar a cotizar.',
        priceNotFound: 'No hay coincidencias con el catálogo actual.',
        quoteSent: 'Hemos recibido tu solicitud.',
        quoteError: 'No se pudo enviar. Revisa los campos obligatorios.',
        paymentConfigMissing: 'Configura tu cuenta PayPal/Stripe en el panel de administración.',
        selectOptionsFirst: 'Selecciona todas las opciones para calcular el precio.'
      },
      stepImages: {}
    };
  </script>
</head>
<body>
<div class="tuservilleta-wizard">
  <div class="tuservilleta-header">
    <div>
      <p class="eyebrow">Personalizador premium</p>
      <h2>Diseña tu servilleta o posavasos</h2>
    </div>
    <div class="pill">6 pasos</div>
  </div>
  <div class="tuservilleta-progress" id="tuservilleta-progress"></div>
  <div id="tuservilleta-steps"></div>
  <div class="tuservilleta-summary" id="tuservilleta-summary">
    <h3>Resumen & presupuesto</h3>
    <div class="summary-grid">
      <div>
        <ul id="tuservilleta-selection"></ul>
        <div class="summary-price" id="tuservilleta-price"></div>
      </div>
      <div class="summary-actions">
        <label>Sube tu imagen (opcional)</label>
        <input type="file" id="tuservilleta-image" accept="image/*" />
        <div class="contact-fields">
          <input type="text" id="tuservilleta-name" placeholder="Nombre completo*" />
          <input type="email" id="tuservilleta-email" placeholder="Email*" />
          <input type="tel" id="tuservilleta-phone" placeholder="Teléfono" />
          <textarea id="tuservilleta-notes" rows="3" placeholder="Notas o requisitos especiales"></textarea>
        </div>
        <div class="action-buttons">
          <button class="btn ghost" id="tuservilleta-send">Enviar a la empresa</button>
          <button class="btn primary" id="tuservilleta-pay">Pagar ahora</button>
        </div>
        <form id="tuservilleta-paypal-form" action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank" style="display:none;">
          <input type="hidden" name="cmd" value="_xclick" />
          <input type="hidden" name="business" value="demo@business.com" />
          <input type="hidden" name="currency_code" value="EUR" />
          <input type="hidden" name="item_name" id="tuservilleta-item-name" value="Personalización" />
          <input type="hidden" name="amount" id="tuservilleta-amount" value="" />
          <input type="hidden" name="return" value="#" />
        </form>
        <div id="tuservilleta-message" class="muted"></div>
      </div>
    </div>
  </div>
  <div id="tuservilleta-hubspot"></div>
</div>
<script src="/tuservilleta-personalizador/assets/js/customizer.js"></script>
</body>
</html>
